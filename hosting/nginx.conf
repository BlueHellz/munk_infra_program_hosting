# Nginx Configuration for MUNKEE STUDIO Application Delivery CDN / Static Host

types {
    application/wasm                      wasm;
    application/javascript                js;
    text/css                              css;
    text/html                             html htm;
    image/svg+xml                         svg;
    image/png                             png;
    image/jpeg                            jpg jpeg;
    application/json                      json;
}

server {
    listen 80;
    server_name studio-apps.munkee.io localhost;

    root /var/www/munkee-studio-infrastructure/dist;
    index index.html;

    # Security Headers for WebAssembly & SharedArrayBuffer
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Embedder-Policy "require-corp" always;
    add_header Cross-Origin-Resource-Policy "cross-origin" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Access-Control-Allow-Origin "*" always;

    # Immutable Cache for Versioned Static Assets
    location ~* \.(js|css|wasm|png|jpg|jpeg|gif|ico|svg|woff2)$ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Application Manifests & Dynamic Registry
    location ~* \/manifest\.json$ {
        add_header Cache-Control "no-cache, must-revalidate";
        expires 0;
    }

    # Application Routing
    location /apps/ {
        try_files $uri $uri/ =404;
    }

    # Legal Notices
    location /legal/ {
        add_header Content-Type "text/plain; charset=utf-8";
    }
}
